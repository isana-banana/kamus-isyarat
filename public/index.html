<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>Kamus Isyarat Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🤟</span>
        <label class="sr-only" for="dictionarySelect">Pilih kamus</label>
        <select id="dictionarySelect" class="dictionary-select" aria-label="Pilih kamus">
          <option value="">Memuat daftar kamus...</option>
        </select>
      </div>
      <a class="admin-link" href="/admin.html">Admin</a>
    </header>

    <main class="container">
      <section class="search-panel" aria-label="Pencarian kata">
        <label class="sr-only" for="searchInput">Cari maksimal lima kata</label>
        <input id="searchInput" type="search"
          placeholder="Cari kata (maksimal 5 kata)..."
          autocomplete="off" maxlength="100">
        <button id="clearSearch" class="clear-button" type="button" aria-label="Hapus pencarian">×</button>
      </section>

      <section class="word-section" aria-label="Daftar kata">
        <div class="section-heading">
          <h2>Daftar Kata</h2>
          <span id="resultInfo" class="result-info">Memuat kamus...</span>
        </div>
        <div id="wordList" class="word-list" tabindex="0">
          <div class="empty-state">Memuat data kamus...</div>
        </div>
      </section>

      <section class="detail-area" aria-label="Materi kata terpilih">
        <div class="detail-grid">
          <article class="detail-cell definition-cell">
            <h2>Keterangan</h2>
            <p id="wordDefinition" class="definition-text">Pilih kata untuk melihat keterangannya.</p>
          </article>
          <article class="detail-cell image-cell">
            <h2>Gambar</h2>
            <div class="image-wrap" id="imageWrap">
              <span class="media-placeholder">Gambar kata yang dipilih</span>
            </div>
          </article>
        </div>

        <article class="video-section">
          <h2>Video Isyarat</h2>
          <div class="video-wrap" id="videoWrap">
            <span class="media-placeholder">Video kata yang dipilih</span>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
