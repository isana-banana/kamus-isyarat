<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Kamus Isyarat Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🤟</div>
        <select id="dictionarySelect" class="dictionary-select" aria-label="Pilih kamus">
          <option value="">Memuat kamus...</option>
        </select>
      </div>
      <a class="admin-link" href="/admin.html">Admin</a>
    </header>

    <main class="container">
      <section class="search-panel">
        <label for="searchInput">Cari kata (maksimal 5 kata)</label>
        <div class="search-row">
          <input id="searchInput" type="search"
            placeholder="Contoh: MAKAN, MINUM, TERIMA KASIH"
            autocomplete="off">
          <button id="clearSearch" class="clear-button" type="button" aria-label="Hapus pencarian">×</button>
        </div>
        <div id="resultInfo" class="result-info">Memuat kamus...</div>
      </section>

      <section class="word-panel" aria-label="Daftar kata">
        <div id="wordList" class="word-list">
          <div class="empty-state">Memuat data kamus...</div>
        </div>
      </section>

      <section id="detailPanel" class="detail-panel" aria-live="polite">
        <div class="detail-top">
          <div class="definition-box">
            <h2 id="selectedWord">Pilih kata</h2>
            <p id="selectedDefinition">Pilih salah satu kata pada daftar untuk melihat definisi, gambar, dan video isyarat.</p>
          </div>
          <div class="image-box" id="imageBox">
            <div class="media-placeholder">Gambar isyarat</div>
          </div>
        </div>
        <div class="video-box" id="videoBox">
          <div class="media-placeholder">Video isyarat</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
