<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Admin - Kamus Isyarat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🤟</div>
      <div>
        <h1>Admin Kamus</h1>
        <p>Pengelolaan daftar kamus</p>
      </div>
    </div>
    <a class="admin-link" href="/">Halaman utama</a>
  </header>

  <main class="container admin-container">
    <section id="loginPanel" class="panel">
      <h2>Login Admin</h2>
      <p>Masukkan kata sandi admin untuk mengelola kamus.</p>
      <form id="loginForm">
        <label for="adminPassword">Kata sandi</label>
        <input id="adminPassword" type="password" required
          autocomplete="current-password">
        <button type="submit">Login</button>
      </form>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="adminPanel" class="panel hidden">
      <div class="section-heading">
        <div>
          <h2>Daftar Kamus</h2>
          <p>Tambahkan folder Google Drive milik kontributor.</p>
        </div>
        <button id="logoutButton" class="button-secondary" type="button">
          Keluar
        </button>
      </div>

      <form id="addDictionaryForm">
        <label for="dictionaryName">Nama kamus</label>
        <input id="dictionaryName" type="text"
          placeholder="Contoh: Kamus Isyarat Bali" required>

        <label for="folderUrl">URL folder Google Drive</label>
        <input id="folderUrl" type="url"
          placeholder="https://drive.google.com/drive/folders/..." required>

        <button type="submit">Tambah Kamus</button>
      </form>

      <div id="adminMessage" class="message"></div>

      <h3>Kamus Terdaftar</h3>
      <div id="adminDictionaryList">
        <div class="empty-state">Memuat daftar kamus...</div>
      </div>
    </section>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
