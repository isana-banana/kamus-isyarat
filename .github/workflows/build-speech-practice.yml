name: Build Latihan Bicara APK

on:
  push:
    branches:
      - feature/latihan-bicara
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p speech-practice assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-debug
          path: speech-practice/app/build/outputs/apk/debug/app-debug.apk
