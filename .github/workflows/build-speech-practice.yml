name: Build Latihan Bicara APK

on:
  push:
    branches:
      - feature/latihan-bicara
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPEECH_KEYSTORE_BASE64: ${{ secrets.SPEECH_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p speech-practice assembleDebug

      - name: Prepare release signing
        if: env.SPEECH_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$SPEECH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/speech-practice-release.jks"

      - name: Build signed release APK
        if: env.SPEECH_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing/speech-practice-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SPEECH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPEECH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPEECH_KEY_PASSWORD }}
        run: gradle -p speech-practice assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-debug
          path: speech-practice/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.SPEECH_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-release-signed
          path: speech-practice/app/build/outputs/apk/release/app-release.apk
