name: Build Latihan Bicara APK

on:
  push:
    branches:
      - feature/latihan-bicara
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPEECH_SIGNING_KEY_PEM: ${{ secrets.SPEECH_SIGNING_KEY_PEM }}
      SPEECH_SIGNING_CERT_PEM: ${{ secrets.SPEECH_SIGNING_CERT_PEM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p speech-practice assembleDebug

      - name: Build unsigned release APK
        run: gradle -p speech-practice assembleRelease

      - name: Sign release APK with text PEM key
        if: env.SPEECH_SIGNING_KEY_PEM != '' && env.SPEECH_SIGNING_CERT_PEM != ''
        env:
          SIGNING_KEY: ${{ secrets.SPEECH_SIGNING_KEY_PEM }}
          SIGNING_CERT: ${{ secrets.SPEECH_SIGNING_CERT_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/signing/key.pem"
          printf '%s' "$SIGNING_CERT" > "$RUNNER_TEMP/signing/cert.pem"

          if ! openssl pkey -in "$RUNNER_TEMP/signing/key.pem" -noout >/dev/null 2>&1; then
            echo "::error::SPEECH_SIGNING_KEY_PEM bukan private key PEM yang valid."
            exit 1
          fi
          if ! openssl x509 -in "$RUNNER_TEMP/signing/cert.pem" -noout >/dev/null 2>&1; then
            echo "::error::SPEECH_SIGNING_CERT_PEM bukan certificate PEM yang valid."
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          INPUT="speech-practice/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/signing/app-release-aligned.apk"
          OUTPUT="speech-practice/app/build/outputs/apk/release/app-release.apk"

          "$ZIPALIGN" -f -p 4 "$INPUT" "$ALIGNED"
          "$APKSIGNER" sign --key "$RUNNER_TEMP/signing/key.pem" --cert "$RUNNER_TEMP/signing/cert.pem" --out "$OUTPUT" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-debug
          path: speech-practice/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.SPEECH_SIGNING_KEY_PEM != '' && env.SPEECH_SIGNING_CERT_PEM != ''
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-release-signed
          path: speech-practice/app/build/outputs/apk/release/app-release.apk
