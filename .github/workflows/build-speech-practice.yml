name: Build Latihan Bicara APK
# Trigger build from repository push

on:
  push:
    branches:
      - feature/latihan-bicara
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPEECH_KEYSTORE_BASE64: ${{ secrets.SPEECH_KEYSTORE_BASE64 }}
      SPEECH_STORE_PASSWORD: ${{ secrets.SPEECH_STORE_PASSWORD }}
      SPEECH_KEY_PASSWORD: ${{ secrets.SPEECH_KEY_PASSWORD }}
      SPEECH_KEY_ALIAS: ${{ secrets.SPEECH_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p speech-practice assembleDebug

      - name: Build unsigned release APK
        run: gradle -p speech-practice assembleRelease

      - name: Sign release APK with PKCS12 keystore
        if: env.SPEECH_KEYSTORE_BASE64 != '' && env.SPEECH_STORE_PASSWORD != '' && env.SPEECH_KEY_PASSWORD != '' && env.SPEECH_KEY_ALIAS != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SPEECH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.p12"

          keytool -list -keystore "$RUNNER_TEMP/signing/release.p12" -storetype PKCS12 \
            -storepass:env SPEECH_STORE_PASSWORD -alias "$SPEECH_KEY_ALIAS" >/dev/null

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          INPUT="speech-practice/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/signing/app-release-aligned.apk"
          OUTPUT="speech-practice/app/build/outputs/apk/release/app-release.apk"

          "$ZIPALIGN" -f -p 4 "$INPUT" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/signing/release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$SPEECH_KEY_ALIAS" \
            --ks-pass env:SPEECH_STORE_PASSWORD \
            --key-pass env:SPEECH_KEY_PASSWORD \
            --out "$OUTPUT" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-debug
          path: speech-practice/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.SPEECH_KEYSTORE_BASE64 != '' && env.SPEECH_STORE_PASSWORD != '' && env.SPEECH_KEY_PASSWORD != '' && env.SPEECH_KEY_ALIAS != ''
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-release-signed
          path: speech-practice/app/build/outputs/apk/release/app-release.apk
