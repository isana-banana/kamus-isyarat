name: Build Latihan Bicara APK

on:
  push:
    branches:
      - feature/latihan-bicara
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPEECH_KEYSTORE_BASE64: ${{ secrets.SPEECH_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p speech-practice assembleDebug

      - name: Prepare release signing
        if: env.SPEECH_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          normalized="$(printf '%s' "$SPEECH_KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')"
          remainder=$((#{#normalized} % 4))
          if [ "$remainder" -eq 2 ]; then normalized="${normalized}=="; fi
          if [ "$remainder" -eq 3 ]; then normalized="${normalized}="; fi
          printf '%s' "$normalized" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/signing/speech-practice-release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/signing/speech-practice-release.jks" -storepass "$SPEECH_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::SPEECH_KEYSTORE_BASE64 berhasil didecode tetapi file keystore tidak valid, atau SPEECH_KEYSTORE_PASSWORD salah."
            exit 1
          fi
        env:
          SPEECH_KEYSTORE_PASSWORD: ${{ secrets.SPEECH_KEYSTORE_PASSWORD }}

      - name: Build signed release APK
        if: env.SPEECH_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing/speech-practice-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SPEECH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPEECH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPEECH_KEY_PASSWORD }}
        run: gradle -p speech-practice assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-debug
          path: speech-practice/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.SPEECH_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: latihan-bicara-release-signed
          path: speech-practice/app/build/outputs/apk/release/app-release.apk
