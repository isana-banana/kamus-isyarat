name: Build Kamus Isyarat APK

on:
  workflow_dispatch:
  push:
    branches: [feature/android-webview]
    paths:
      - "android-webview/**"
      - ".github/workflows/build-android-webview.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-webview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamus-Isyarat-debug-apk
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
