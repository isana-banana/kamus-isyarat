name: Build Kamus Isyarat Offline APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-offline]
    paths:
      - "android-offline/**"
      - ".github/workflows/build-android-offline.yml"
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-offline
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamus-Isyarat-Offline-debug-apk
          path: android-offline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# build trigger after Kotlin fix
